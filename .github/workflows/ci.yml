name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace + plugin structure
        run: python3 .github/scripts/validate_plugins.py
      - name: Skill-description cap gate (skill-listing truncation)
        run: python3 scripts/check_skill_descriptions.py . --no-color --triggers
      - name: Leak gate (client/PII identifiers)
        run: bash scripts/leak_scan.sh .
      - name: Skill-route gate (reachability, links, README index)
        run: python3 scripts/check_skill_routes.py .
      - name: Skill-tier gate (listing budget policy)
        run: python3 scripts/check_skill_tiers.py . --context 200000 --bytes-per-token 4
      - name: Listing budget assertion (from the vendored gate's own JSON)
        run: |
          python3 scripts/check_skill_descriptions.py . --json > /tmp/desc.json
          python3 -c "import json,sys; d=json.load(open('/tmp/desc.json')); sys.exit(0 if d['within_budget'] else print('listing %d over budget %d' % (d['listing_chars'], d['budget_chars'])) or 1)"
